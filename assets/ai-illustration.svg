<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151A"/>
      <stop offset="100%" stop-color="#1F212A"/>
    </linearGradient>
    <linearGradient id="ai-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="ai-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <radialGradient id="ai-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="320" rx="20" fill="url(#ai-bg)"/>
  
  <!-- Subtle Matrix Dot Grid -->
  <g opacity="0.15" fill="#FFFFFF">
    <circle cx="50" cy="50" r="1.5"/><circle cx="90" cy="50" r="1.5"/><circle cx="130" cy="50" r="1.5"/><circle cx="170" cy="50" r="1.5"/><circle cx="210" cy="50" r="1.5"/>
    <circle cx="250" cy="50" r="1.5"/><circle cx="290" cy="50" r="1.5"/><circle cx="330" cy="50" r="1.5"/><circle cx="370" cy="50" r="1.5"/><circle cx="410" cy="50" r="1.5"/><circle cx="450" cy="50" r="1.5"/>
    <circle cx="50" cy="90" r="1.5"/><circle cx="90" cy="90" r="1.5"/><circle cx="130" cy="90" r="1.5"/><circle cx="170" cy="90" r="1.5"/><circle cx="210" cy="90" r="1.5"/>
    <circle cx="250" cy="90" r="1.5"/><circle cx="290" cy="90" r="1.5"/><circle cx="330" cy="90" r="1.5"/><circle cx="370" cy="90" r="1.5"/><circle cx="410" cy="90" r="1.5"/><circle cx="450" cy="90" r="1.5"/>
    <circle cx="50" cy="130" r="1.5"/><circle cx="90" cy="130" r="1.5"/><circle cx="130" cy="130" r="1.5"/><circle cx="170" cy="130" r="1.5"/><circle cx="210" cy="130" r="1.5"/>
    <circle cx="250" cy="130" r="1.5"/><circle cx="290" cy="130" r="1.5"/><circle cx="330" cy="130" r="1.5"/><circle cx="370" cy="130" r="1.5"/><circle cx="410" cy="130" r="1.5"/><circle cx="450" cy="130" r="1.5"/>
    <circle cx="50" cy="170" r="1.5"/><circle cx="90" cy="170" r="1.5"/><circle cx="130" cy="170" r="1.5"/><circle cx="170" cy="170" r="1.5"/><circle cx="210" cy="170" r="1.5"/>
    <circle cx="250" cy="170" r="1.5"/><circle cx="290" cy="170" r="1.5"/><circle cx="330" cy="170" r="1.5"/><circle cx="370" cy="170" r="1.5"/><circle cx="410" cy="170" r="1.5"/><circle cx="450" cy="170" r="1.5"/>
    <circle cx="50" cy="210" r="1.5"/><circle cx="90" cy="210" r="1.5"/><circle cx="130" cy="210" r="1.5"/><circle cx="170" cy="210" r="1.5"/><circle cx="210" cy="210" r="1.5"/>
    <circle cx="250" cy="210" r="1.5"/><circle cx="290" cy="210" r="1.5"/><circle cx="330" cy="210" r="1.5"/><circle cx="370" cy="210" r="1.5"/><circle cx="410" cy="210" r="1.5"/><circle cx="450" cy="210" r="1.5"/>
    <circle cx="50" cy="250" r="1.5"/><circle cx="90" cy="250" r="1.5"/><circle cx="130" cy="250" r="1.5"/><circle cx="170" cy="250" r="1.5"/><circle cx="210" cy="250" r="1.5"/>
    <circle cx="250" cy="250" r="1.5"/><circle cx="290" cy="250" r="1.5"/><circle cx="330" cy="250" r="1.5"/><circle cx="370" cy="250" r="1.5"/><circle cx="410" cy="250" r="1.5"/><circle cx="450" cy="250" r="1.5"/>
  </g>

  <!-- Central Glow -->
  <circle cx="250" cy="160" r="130" fill="url(#ai-glow)"/>

  <!-- Neural Mesh Connections -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5">
    <line x1="120" y1="160" x2="190" y2="100"/>
    <line x1="120" y1="160" x2="190" y2="220"/>
    <line x1="120" y1="160" x2="190" y2="160"/>
    <line x1="190" y1="100" x2="250" y2="70"/>
    <line x1="190" y1="100" x2="250" y2="135"/>
    <line x1="190" y1="160" x2="250" y2="135"/>
    <line x1="190" y1="160" x2="250" y2="185"/>
    <line x1="190" y1="220" x2="250" y2="185"/>
    <line x1="190" y1="220" x2="250" y2="250"/>
    <line x1="250" y1="70" x2="310" y2="100"/>
    <line x1="250" y1="135" x2="310" y2="100"/>
    <line x1="250" y1="135" x2="310" y2="160"/>
    <line x1="250" y1="185" x2="310" y2="160"/>
    <line x1="250" y1="185" x2="310" y2="220"/>
    <line x1="250" y1="250" x2="310" y2="220"/>
    <line x1="310" y1="100" x2="380" y2="160"/>
    <line x1="310" y1="160" x2="380" y2="160"/>
    <line x1="310" y1="220" x2="380" y2="160"/>
  </g>

  <!-- Active Synapse Pulses -->
  <path d="M120 160 Q 200 90 250 135 T 380 160" stroke="url(#ai-cyan)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M120 160 Q 200 230 250 185 T 380 160" stroke="url(#ai-coral)" stroke-width="2" fill="none" stroke-dasharray="4 4"/>

  <!-- Geometric Rings / Orb -->
  <circle cx="250" cy="160" r="50" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6 8"/>
  <circle cx="250" cy="160" r="70" stroke="#E07A5F" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Neural Nodes -->
  <!-- Layer 0 -->
  <circle cx="120" cy="160" r="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="120" cy="160" r="3" fill="#38BDF8"/>
  <!-- Layer 1 -->
  <circle cx="190" cy="100" r="6" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="190" cy="160" r="7" fill="#1E293B" stroke="#818CF8" stroke-width="2"/>
  <circle cx="190" cy="220" r="6" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
  <!-- Layer 2 (Core) -->
  <circle cx="250" cy="70" r="6" fill="#1E293B" stroke="#E07A5F" stroke-width="2"/>
  <circle cx="250" cy="135" r="9" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="250" cy="135" r="4" fill="#38BDF8"/>
  <circle cx="250" cy="185" r="9" fill="#1E293B" stroke="#E07A5F" stroke-width="2.5"/>
  <circle cx="250" cy="185" r="4" fill="#E07A5F"/>
  <circle cx="250" cy="250" r="6" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <!-- Layer 3 -->
  <circle cx="310" cy="100" r="6" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="310" cy="160" r="7" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="310" cy="220" r="6" fill="#1E293B" stroke="#E07A5F" stroke-width="2"/>
  <!-- Output Node -->
  <circle cx="380" cy="160" r="9" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="380" cy="160" r="4" fill="#38BDF8"/>

  <!-- Mathematical / Code Floating Tokens -->
  <g font-family="monospace" font-size="10" fill="#94A3B8" opacity="0.8">
    <text x="50" y="280">W · x + b → f(z)</text>
    <text x="360" y="55">f_loss = 0.0024</text>
  </g>

  <!-- Editorial Badge Tag -->
  <g transform="translate(35, 30)">
    <rect width="115" height="24" rx="12" fill="#252836"/>
    <text x="14" y="16" fill="#38BDF8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1">NEURAL TECH</text>
  </g>
</svg>

