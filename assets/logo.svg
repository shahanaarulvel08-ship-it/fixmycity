<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123B63" />
      <stop offset="100%" stop-color="#0A2239" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2496D8" />
      <stop offset="100%" stop-color="#1976D2" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EAD72" />
      <stop offset="100%" stop-color="#238B5B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#123B63" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <path d="M100 16 L164 42 C164 100 138 148 100 182 C62 148 36 100 36 42 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)" stroke="#2496D8" stroke-width="2.5" />

  <!-- City Skyline Silhouette -->
  <!-- Building 1 (Left) -->
  <rect x="58" y="92" width="16" height="42" rx="2" fill="#2496D8" opacity="0.85" />
  <rect x="62" y="98" width="3" height="4" fill="#FFFFFF" opacity="0.8" />
  <rect x="68" y="98" width="3" height="4" fill="#FFFFFF" opacity="0.8" />
  <rect x="62" y="106" width="3" height="4" fill="#FFFFFF" opacity="0.8" />
  <rect x="68" y="106" width="3" height="4" fill="#FFFFFF" opacity="0.8" />
  <rect x="62" y="114" width="3" height="4" fill="#FFFFFF" opacity="0.8" />
  <rect x="68" y="114" width="3" height="4" fill="#FFFFFF" opacity="0.8" />

  <!-- Building 2 (Center Spire / City Hall) -->
  <path d="M92 70 L100 52 L108 70 V134 H92 Z" fill="#FFFFFF" />
  <!-- Clock / Civic Circle -->
  <circle cx="100" cy="80" r="4.5" fill="#123B63" />
  <circle cx="100" cy="80" r="1.5" fill="#2496D8" />
  <rect x="96" y="94" width="8" height="40" fill="#2496D8" opacity="0.3" />

  <!-- Building 3 (Right) -->
  <rect x="126" y="84" width="18" height="50" rx="2" fill="#2496D8" opacity="0.85" />
  <rect x="130" y="90" width="3.5" height="4" fill="#FFFFFF" opacity="0.8" />
  <rect x="137" y="90" width="3.5" height="4" fill="#FFFFFF" opacity="0.8" />
  <rect x="130" y="98" width="3.5" height="4" fill="#FFFFFF" opacity="0.8" />
  <rect x="137" y="98" width="3.5" height="4" fill="#FFFFFF" opacity="0.8" />
  <rect x="130" y="106" width="3.5" height="4" fill="#FFFFFF" opacity="0.8" />
  <rect x="137" y="106" width="3.5" height="4" fill="#FFFFFF" opacity="0.8" />

  <!-- Dynamic Civic Road / Arc -->
  <path d="M50 134 Q100 148 150 134" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Vibrant Accent Checkmark Badge (Civic Resolution & Action) -->
  <circle cx="138" cy="138" r="22" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="3" filter="url(#shadow)" />
  <path d="M128 138 L135 145 L149 131" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>

